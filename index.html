let added=false;for(const [id,name] of preloadedPlayers){let first=name.split(' ')[0].toLocaleLowerCase('nl');let existing=S.players.find(p=>p.id===id||p.name.trim().toLocaleLowerCase('nl')===name.toLocaleLowerCase('nl')||p.name.trim().toLocaleLowerCase('nl')===first);if(!existing){S.players.push(item({id,name}));added=true}}if(!S.setup&&S.players.length){S.setup=true;added=true}if(added){S.updatedAt=now();try{localStorage.setItem('galway-state',JSON.stringify(S))}catch(e){console.error('Opslaan mislukt',e)}}

function ico(naam){return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONEN[naam]||''}</svg>`}
function ibtn(naam,tekst,actie,cl='secondary'){return `<button class="${cl} ico-btn" onclick="${actie}" aria-label="${esc(tekst)}" title="${esc(tekst)}">${ico(naam)}</button>`}
function save(){S.updatedAt=now();try{localStorage.setItem('galway-state',JSON.stringify(S))}catch(e){alert('Opslaan mislukt: mogelijk is de opslag vol. Maak een back-up.');throw e}}function touch(o){o.updatedAt=now();save()}function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2400)}function go(p){page=p;render();window.scrollTo(0,0)}function sub(p){more=p;go('Meer')}function closeModal(){$('#modal').close()}function modal(title,body){$('#modal').innerHTML=`<div class="spread"><h2>${esc(title)}</h2><button class="secondary" onclick="closeModal()" aria-label="Sluiten" title="Sluiten">${ico('kruis')}</button></div>${body}`;$('#modal').showModal()}function pname(id){return S.players.find(p=>p.id===id)?.name||'Onbekend'}function options(selected='',all=false){if(!selected&&!all)selected=localStorage.getItem('galway-current-player')||'';return `${all?`<option value="all">Iedereen</option>`:''}${S.players.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}`}function score(id){return S.transactions.filter(t=>t.playerId===id).reduce((a,t)=>a+t.points,0)}function ranking(){return [...S.players].sort((a,b)=>score(b.id)-score(a.id))}function addPoints(ids,points,reason,source){ids.forEach(playerId=>S.transactions.push(item({playerId,points:+points,reason,source})));save()}function removeSource(source){S.transactions=S.transactions.filter(t=>t.source!==source)}function card(t,b){return `<section class="card"><h2>${t}</h2>${b}</section>`}function btn(t,action,cl='secondary'){return `<button class="${cl}" onclick="${action}">${t}</button>`}
function render(){if(!S.setup){setup();return}if(!S.players.some(p=>p.id===localStorage.getItem('galway-current-player'))){choosePlayer();return}$('#nav').innerHTML=[['Home','⌂'],['Pubs','🍺'],['Challenges','🏆'],['Rad','🎡'],['Scores','⭐'],['Meer','☘']].map(([p,i])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${p}</button>`).join('');$('#app').innerHTML=({Home:home,Pubs:pubPage,Challenges:challengePage,Rad:wheelPage,Scores:scorePage,Meer:morePage})[page]();if(page==='Rad')drawWheel();if(page==='Meer'&&more==='Fotoalbum')loadPhotos();}
function choosePlayer(){$('#nav').innerHTML='';$('#app').innerHTML=card('Wie ben jij?',`<p>Kies je naam. Dit toestel onthoudt je keuze.</p><div class="stack">${S.players.map(p=>`<button onclick="selectPlayer('${p.id}')">${esc(p.name)}</button>`).join('')}</div>`)}function selectPlayer(id){localStorage.setItem('galway-current-player',id);render()}
function setup(){$('#nav').innerHTML='';$('#app').innerHTML=card('Wie gaat er mee?',`<p>De namen van jullie reisgezelschap, één per regel. Emoji mag ook. Je kunt dit later aanpassen.</p><textarea id="names" rows="6" placeholder="Dylan&#10;Vriend 2"></textarea><button onclick="finishSetup()">Op naar Galway →</button>`)}function finishSetup(){let names=$('#names').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!names.length)return alert('Vul minstens één naam in.');S.players=names.map(name=>item({name}));S.setup=true;save();render()}
function home(){let d=new Date(),day=days.find(x=>x.toLowerCase()===d.toLocaleDateString('nl-NL',{weekday:'long'}).toLowerCase()),acts=S.activities.filter(a=>a.day===day&&!a.done).sort((a,b)=>a.time.localeCompare(b.time)),word=words[Math.floor(d.getTime()/864e5)%words.length],lead=ranking()[0];return `<section class="card hero"><span class="eyebrow">De craic begint hier</span><h2>Hoi ${esc(pname(localStorage.getItem('galway-current-player')))}! Goed${d.getHours()<12?'emorgen':d.getHours()<18?'emiddag':'enavond'}, eejits!</h2><p>${esc(day||d.toLocaleDateString('nl-NL',{weekday:'long'}))} · ${d.getHours()<12?'ochtend':d.getHours()<18?'middag':'avond'}</p><button onclick="sub('Vragen')">Ik verveel me</button></section>${card('Woord van de dag',`<h3>${word[0]}</h3><p>${word[1]} · ${word[2]}</p>`)}${card('Vandaag',acts.length?acts.map(a=>`<p><b>${esc(a.time||'Tijd volgt')} · ${esc(a.title)}</b><br><span class="muted">${esc(a.location)}</span></p>`).join(''):'<p>Geen open activiteiten voor vandaag. Tijd voor craic?</p>')}${card('De stand',lead?`<p>${esc(lead.name)} staat bovenaan met <b>${score(lead.id)} punten</b>.</p><button class="secondary" onclick="go('Scores')">Bekijk de stand</button>`:'Nog geen spelers.')}`}
function pubPage(){let count=S.pubs.filter(p=>p.visitedAt).length;return `<div class="spread"><div><span class="eyebrow">The pub crawl</span><h2>De pubs</h2></div><button onclick="editPub()">+ Pub</button></div><p>${count} / ${S.pubs.length} bezocht</p><progress max="${S.pubs.length||1}" value="${count}"></progress><div class="actions">${btn('Kies random pub','randomPub()')}</div>${S.pubs.map(p=>`<section class="card"><div class="spread"><div><h3>${esc(p.name)}</h3><span class="muted">${esc(p.gimmick)}</span></div>${p.visitedAt?'<span class="tag">bezocht</span>':''}</div>${p.visitedAt?`<p class="muted">Bezocht: ${new Date(p.visitedAt).toLocaleString('nl-NL')} · ${p.visitors.map(pname).map(esc).join(', ')}</p>`:''}<div class="actions">${btn(p.visitedAt?'Bezoek aanpassen':'Afvinken',`visitPub('${p.id}')`)}${btn('Foto',`photoInput('${p.id}')`)}${btn('Beoordelen',`ratePub('${p.id}')`)}${ibtn('bewerken','Pub bewerken',`editPub('${p.id}')`)}${ibtn('verwijderen','Pub verwijderen',`deletePub('${p.id}')`,'danger')}</div></section>`).join('')}`}
function editPub(id){let p=S.pubs.find(x=>x.id===id)||{};modal(id?'Pub bewerken':'Nieuwe pub',`<label>Naam</label><input id="f-name" value="${esc(p.name||'')}"><label>Opdracht / gimmick</label><input id="f-gimmick" value="${esc(p.gimmick||'')}"><button onclick="savePub('${id||''}')">Opslaan</button>`)}function savePub(id){let name=$('#f-name').value.trim();if(!name)return;let p=S.pubs.find(x=>x.id===id);if(!p){p=item({visitedAt:null,visitors:[],ratings:{}});S.pubs.push(p)}p.name=name;p.gimmick=$('#f-gimmick').value;touch(p);closeModal();render()}function deletePub(id){if(!confirm('Deze pub verwijderen? Foto’s blijven in het album.'))return;S.pubs=S.pubs.filter(p=>p.id!==id);removeSource('pub:'+id);save();render()}function randomPub(){let a=S.pubs.filter(p=>!p.visitedAt);alert(a.length?'De volgende halte: '+a[Math.floor(Math.random()*a.length)].name+'!':'Alle pubs zijn bezocht. Sláinte!')}
function visitPub(id){let p=S.pubs.find(x=>x.id===id);modal('Wie was erbij?',`<p>Iedere deelnemer krijgt +1 punt.</p>${S.players.map(x=>`<label class="row"><input class="visitor" type="checkbox" value="${x.id}" ${!p.visitedAt||p.visitors.includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')}<div class="actions"><button onclick="saveVisit('${id}')">Sláinte! Bezoek opslaan</button>${p.visitedAt?btn('Bezoek ongedaan maken',`undoVisit('${id}')`,'danger'):''}</div>`)}function saveVisit(id){let p=S.pubs.find(x=>x.id===id),first=!p.visitedAt;p.visitors=[...document.querySelectorAll('.visitor:checked')].map(x=>x.value);p.visitedAt=p.visitedAt||now();removeSource('pub:'+id);addPoints(p.visitors,1,'Pub: '+p.name,'pub:'+id);touch(p);closeModal();render();if(first&&confirm('Bezoek opgeslagen! Nu een foto toevoegen?'))photoInput(id)}function undoVisit(id){let p=S.pubs.find(x=>x.id===id);p.visitedAt=null;p.visitors=[];removeSource('pub:'+id);touch(p);closeModal();render()}
function ratePub(id){let p=S.pubs.find(x=>x.id===id);modal('Beoordeel '+p.name,`<label>Speler</label><select id="r-player" onchange="rateFields('${id}')">${options()}</select><div id="rate-fields"></div><button onclick="saveRating('${id}')">Opslaan</button>`);rateFields(id)}function rateFields(id){let p=S.pubs.find(x=>x.id===id),r=p.ratings[$('#r-player').value]||{};$('#rate-fields').innerHTML=['sfeer','Guinness','muziek'].map(k=>`<label>${k}</label><select id="rate-${k}"><option value="0">Niet beoordeeld</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${r[k]===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select>`).join('')}function saveRating(id){let p=S.pubs.find(x=>x.id===id);p.ratings[$('#r-player').value]={id:uid(),updatedAt:now(),...Object.fromEntries(['sfeer','Guinness','muziek'].map(k=>[k,+$('#rate-'+k).value]))};touch(p);closeModal();toast('Beoordeling opgeslagen!')}
let db;function database(){return new Promise((resolve,reject)=>{if(db)return resolve(db);let req=indexedDB.open('galway-photos',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>resolve(db=req.result);req.onerror=()=>reject(req.error)})}async function photoDB(mode,key,value){let d=await database();return new Promise((resolve,reject)=>{let tx=d.transaction('photos',mode==='get'?'readonly':'readwrite'),st=tx.objectStore('photos'),req=mode==='get'?st.get(key):mode==='put'?st.put(value,key):st.delete(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}function photoInput(pubId=''){modal('Foto toevoegen',`<p>Maak of kies een foto. Deze blijft op dit apparaat.</p><input id="photo-file" type="file" accept="image/*" capture="environment"><button onclick="savePhoto('${pubId}')">Foto opslaan</button>`)}async function savePhoto(pubId){let file=$('#photo-file').files[0];if(!file)return alert('Kies eerst een foto.');try{let img=await createImageBitmap(file),canvas=document.createElement('canvas'),scale=Math.min(1,1200/img.width);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.7));if(!blob)throw Error('Omzetten mislukt');let p=item({pubId,name:S.pubs.find(x=>x.id===pubId)?.name||'Galway',createdAt:now()});await photoDB('put',p.id,blob);S.photos.push(p);save();closeModal();toast('Foto opgeslagen!')}catch(e){alert('Foto opslaan lukte niet: '+e.message)}}
function challengePage(){return `<div class="spread"><div><span class="eyebrow">Voor eeuwige roem</span><h2>Challenges</h2></div><button onclick="editChallenge()">+ Challenge</button></div>${S.challenges.map(c=>`<section class="card"><div class="spread"><h3>${esc(c.title)}</h3><span class="tag">+${c.points}</span></div><p class="muted">${esc(c.category)} · ${c.assignee==='all'?'Iedereen':esc(pname(c.assignee))} · Gelukt: ${c.completed.length?c.completed.map(pname).map(esc).join(', '):'nog niemand'}</p><div class="actions">${btn('Sláinte! Afvinken',`completeChallenge('${c.id}')`)}${ibtn('bewerken','Challenge bewerken',`editChallenge('${c.id}')`)}${ibtn('verwijderen','Challenge verwijderen',`deleteChallenge('${c.id}')`,'danger')}</div></section>`).join('')}`}
function editChallenge(id){let c=S.challenges.find(x=>x.id===id)||{points:2,category:'Solo',assignee:'all'};modal('Challenge',`<label>Titel</label><input id="c-title" value="${esc(c.title||'')}"><div class="split"><div><label>Punten</label><input id="c-points" type="number" value="${c.points}"></div><div><label>Categorie</label><select id="c-cat">${['Solo','Groep','Per pub','Toerist'].map(x=>`<option ${x===c.category?'selected':''}>${x}</option>`).join('')}</select></div></div><label>Toewijzen aan</label><select id="c-who">${options(c.assignee,true)}</select><button onclick="saveChallenge('${id||''}')">Opslaan</button>`)}function saveChallenge(id){let title=$('#c-title').value.trim();if(!title)return;let c=S.challenges.find(x=>x.id===id);if(!c){c=item({completed:[]});S.challenges.push(c)}Object.assign(c,{title,points:+$('#c-points').value,category:$('#c-cat').value,assignee:$('#c-who').value});touch(c);closeModal();render()}function completeChallenge(id){let c=S.challenges.find(x=>x.id===id),players=c.assignee==='all'?S.players:S.players.filter(p=>p.id===c.assignee);modal('Wie heeft het gehaald?',`${players.map(p=>`<label class="row"><input class="done-player" type="checkbox" value="${p.id}" ${c.completed.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}<p class="muted">Bij een groepsfoto: vink iedereen aan.</p><button onclick="saveCompletion('${id}')">Sláinte! Opslaan</button>`)}function saveCompletion(id){let c=S.challenges.find(x=>x.id===id);c.completed=[...document.querySelectorAll('.done-player:checked')].map(x=>x.value);removeSource('challenge:'+id);addPoints(c.completed,c.points,c.title,'challenge:'+id);touch(c);closeModal();render();toast('Sláinte!')}function deleteChallenge(id){if(!confirm('Challenge en bijbehorende punten verwijderen?'))return;S.challenges=S.challenges.filter(c=>c.id!==id);removeSource('challenge:'+id);save();render()}
function scorePage(){return `<div class="spread"><div><span class="eyebrow">Roem &amp; rivaliteit</span><h2>Scoreboard</h2></div><button onclick="bonus()">+ / − Punten</button></div>${ranking().map((p,i)=>`<div class="card spread"><div><b>${['🥇','🥈','🥉'][i]||'#'+(i+1)} ${esc(p.name)}</b><div class="muted">${S.pubs.filter(x=>x.visitors.includes(p.id)).length} pubs bezocht</div></div><span class="score">${score(p.id)}</span></div>`).join('')}${card('Galway Wrapped','<p>De cijfers, de helden en de verhalen van jullie trip.</p><button onclick="sub(\'Wrapped\')">Bekijk Wrapped</button>')}`}
function bonus(){modal('Bonus of straf',`<label>Speler</label><select id="b-player">${options()}</select><label>Punten (negatief mag)</label><input id="b-points" type="number" value="1"><label>Reden (optioneel)</label><input id="b-reason"><button onclick="saveBonus()">Punten toevoegen</button>`)}function saveBonus(){let n=Number($('#b-points').value);if(!Number.isFinite(n))return;addPoints([$('#b-player').value],n,$('#b-reason').value||'Handmatige punten','bonus:'+uid());closeModal();render()}
function wheelPage(){return `<span class="eyebrow">Het lot beslist</span><h2>Rad van fortuin</h2><select id="wheel-select" onchange="drawWheel()">${S.wheels.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><div class="card"><p style="text-align:center;font-size:1.5rem;margin:0">▼</p><canvas class="wheel" id="canvas" width="400" height="400"></canvas><p id="wheel-result" style="text-align:center"></p><label class="row"><input id="remove-result" type="checkbox"> Uitkomst verwijderen na draaien</label><div class="actions"><button id="spin" onclick="spinWheel()">Draai maar! 🎡</button>${btn('Wiel aanpassen','editWheel()')}</div></div>`}function segments(){let w=S.wheels.find(w=>w.id===$('#wheel-select').value);return w.name==='Pubkiezer'?S.pubs.filter(p=>!p.visitedAt).map(p=>({id:p.id,label:p.name})):w.name==='Wie moet betalen?'?S.players.map(p=>({id:p.id,label:p.name})):w.segments}function drawWheel(){let c=$('#canvas');if(!c)return;let ctx=c.getContext('2d'),a=segments();ctx.clearRect(0,0,400,400);if(!a.length){ctx.fillStyle='#e4c36b';ctx.fillText('Geen opties beschikbaar',125,200);return}a.forEach((s,i)=>{let start=wheelAngle+i*2*Math.PI/a.length,end=wheelAngle+(i+1)*2*Math.PI/a.length;ctx.beginPath();ctx.moveTo(200,200);ctx.arc(200,200,190,start,end);ctx.fillStyle=['#19583e','#d1ad59','#39704f','#9b7440'][i%4];ctx.fill();ctx.save();ctx.translate(200,200);ctx.rotate((start+end)/2);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='right';ctx.fillText(s.label.slice(0,20),175,5);ctx.restore()})}function spinWheel(){let a=segments();if(!a.length)return;let index=Math.floor(Math.random()*a.length),n=a.length,target=-Math.PI/2-(index+.5)*2*Math.PI/n,start=wheelAngle,diff=((target-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+Math.PI*2*5,t0=performance.now();$('#spin').disabled=true;function frame(t){let x=Math.min(1,(t-t0)/3500),ease=1-Math.pow(1-x,3);wheelAngle=start+diff*ease;drawWheel();if(x<1)requestAnimationFrame(frame);else{$('#spin').disabled=false;$('#wheel-result').textContent='☘ '+a[index].label+'!';navigator.vibrate?.([50,50,100]);let w=S.wheels.find(w=>w.id===$('#wheel-select').value);if($('#remove-result').checked&&!['Pubkiezer','Wie moet betalen?'].includes(w.name)){w.segments=w.segments.filter(s=>s.id!==a[index].id);touch(w)}}}requestAnimationFrame(frame)}function editWheel(){let w=S.wheels.find(w=>w.id===$('#wheel-select').value);if(['Pubkiezer','Wie moet betalen?'].includes(w.name))return alert('Dit wiel gebruikt automatisch de actuele pubs of spelers.');modal('Wiel aanpassen',`<p>Één optie per regel.</p><textarea id="wheel-lines" rows="9">${esc(w.segments.map(x=>x.label).join('\n'))}</textarea><button onclick="saveWheel('${w.id}')">Opslaan</button>`)}function saveWheel(id){let w=S.wheels.find(x=>x.id===id);w.segments=$('#wheel-lines').value.split('\n').map(x=>x.trim()).filter(Boolean).map(label=>item({label}));touch(w);closeModal();render()}
const menu=['Vandaag & planning','Fotoalbum','Vragen','Uitgaven','Bingo','Wrapped','Handige info','Spelers','Back-up'];function morePage(){if(more==='Meer')return `<h2>Meer craic</h2>${menu.map(x=>`<div class="card spread"><b>${x}</b><button class="secondary" onclick="sub('${x}')">Open →</button></div>`).join('')}`;let head=`<div class="spread"><h2>${esc(more)}</h2><button class="secondary" onclick="sub('Meer')">← Terug</button></div>`;return head+({ 'Vandaag & planning':planPage,'Fotoalbum':albumPage,'Vragen':questionsPage,'Uitgaven':expensePage,'Bingo':bingoPage,'Wrapped':wrappedPage,'Handige info':infoPage,'Spelers':playersPage,'Back-up':backupPage}[more])()}
function planPage(){return `<button onclick="editActivity()">+ Activiteit</button>${days.map(d=>card(d,S.activities.filter(a=>a.day===d).sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div class="spread"><b>${a.done?'✅ ':''}${esc(a.time||'Tijd volgt')} · ${esc(a.title)}</b><input type="checkbox" ${a.done?'checked':''} onchange="toggleActivity('${a.id}',this.checked)"></div><div class="muted">${esc(a.location)} ${esc(a.note)}</div><div class="actions">${ibtn('bewerken','Activiteit bewerken',`editActivity('${a.id}')`)}${ibtn('verwijderen','Activiteit verwijderen',`deleteActivity('${a.id}')`,'danger')}</div></div>`).join('')||'<p class="muted">Nog niets gepland.</p>')).join('')}`}
function editActivity(id){let a=S.activities.find(x=>x.id===id)||{};modal('Activiteit',`<label>Titel</label><input id="a-title" value="${esc(a.title||'')}"><label>Dag</label><select id="a-day">${days.map(d=>`<option ${d===a.day?'selected':''}>${d}</option>`).join('')}</select><label>Tijd</label><input type="time" id="a-time" value="${esc(a.time||'')}"><label>Locatie</label><input id="a-location" value="${esc(a.location||'')}"><label>Notitie</label><textarea id="a-note">${esc(a.note||'')}</textarea><label>Optionele groepsfoto-challenge (punten per persoon; 0 = geen)</label><input type="number" id="a-points" value="0"><button onclick="saveActivity('${id||''}')">Opslaan</button>`)}function saveActivity(id){let title=$('#a-title').value.trim();if(!title)return;let a=S.activities.find(x=>x.id===id);if(!a){a=item({done:false});S.activities.push(a)}Object.assign(a,{title,day:$('#a-day').value,time:$('#a-time').value,location:$('#a-location').value,note:$('#a-note').value});let pts=+$('#a-points').value;if(pts>0)S.challenges.push(item({title:'Groepsfoto: '+title,category:'Groep',points:pts,assignee:'all',completed:[],activityId:a.id}));touch(a);closeModal();render()}function toggleActivity(id,value){let a=S.activities.find(x=>x.id===id);a.done=value;touch(a);render()}function deleteActivity(id){if(!confirm('Activiteit verwijderen?'))return;S.activities=S.activities.filter(x=>x.id!==id);save();render()}
function albumPage(){return `<p>Foto’s staan alleen op dit apparaat.</p><button onclick="photoInput()">+ Foto toevoegen</button><div id="photos"></div>`}async function loadPhotos(){let el=$('#photos');if(!el)return;el.innerHTML='';for(let p of S.photos){let blob=await photoDB('get',p.id);if(!blob)continue;let url=URL.createObjectURL(blob),div=document.createElement('div');div.className='card';div.innerHTML=`<h3>${esc(p.name)}</h3><img style="width:100%;border-radius:12px" src="${url}" alt="${esc(p.name)}"><div class="actions"><a class="button secondary" href="${url}" download="galway-${p.id}.jpg">Download</a><button class="danger" onclick="deletePhoto('${p.id}')">Verwijderen</button></div>`;el.appendChild(div)}}async function deletePhoto(id){if(!confirm('Foto verwijderen?'))return;await photoDB('delete',id);S.photos=S.photos.filter(p=>p.id!==id);save();render()}
function questionsPage(){return `<p>Kies een categorie. Vragen herhalen pas als alles aan bod is geweest.</p><select id="q-category">${Object.keys(qsets).map(x=>`<option>${esc(x)}</option>`).join('')}</select><button onclick="nextQuestion()">Geef me een vraag</button><div class="card"><h3 id="question">${esc(lastQuestion||'Klaar voor een goed verhaal?')}</h3></div><button class="secondary" onclick="addQuestion()">+ Eigen vraag</button>`}function nextQuestion(){let cat=$('#q-category').value,qs=S.questions.filter(q=>q.category===cat),available=qs.filter(q=>!q.used);if(!available.length){qs.forEach(q=>{q.used=false;q.updatedAt=now()});available=qs}if(!available.length)return;let q=available[Math.floor(Math.random()*available.length)];q.used=true;touch(q);lastQuestion=q.text;$('#question').textContent=q.text}function addQuestion(){let category=$('#q-category').value;modal('Eigen vraag',`<p>${esc(category)}</p><textarea id="q-text"></textarea><button onclick="saveQuestion('${category.replace(/'/g,'&#39;')}')">Opslaan</button>`)}function saveQuestion(category){let text=$('#q-text').value.trim();if(text)S.questions.push(item({category,text,used:false}));save();closeModal();render()}
function expensePage(){let balances=Object.fromEntries(S.players.map(p=>[p.id,0]));for(let e of S.expenses){let n=e.participants.length;if(!n||!(e.payer in balances))continue;balances[e.payer]+=e.cents;let base=Math.floor(e.cents/n),rem=e.cents%n;e.participants.forEach((id,i)=>{if(id in balances)balances[id]-=base+(i<rem?1:0)})}let debt=Object.entries(balances).filter(x=>x[1]<0).map(([id,n])=>({id,n:-n})),credit=Object.entries(balances).filter(x=>x[1]>0).map(([id,n])=>({id,n})),settle=[];while(debt.length&&credit.length){debt.sort((a,b)=>b.n-a.n);credit.sort((a,b)=>b.n-a.n);let d=debt[0],c=credit[0],v=Math.min(d.n,c.n);settle.push(`${esc(pname(d.id))} → ${esc(pname(c.id))}: <b>${fmt(v)}</b>`);d.n-=v;c.n-=v;if(!d.n)debt.shift();if(!c.n)credit.shift()}return `<button onclick="addExpense()">+ Uitgave</button>${card('Afrekenen',settle.length?settle.map(x=>`<p>${x}</p>`).join(''):'<p>Niemand staat in het krijt. Grand!</p>')}${card('Uitgaven',S.expenses.map(e=>`<p><b>${esc(e.title)} · ${fmt(e.cents)}</b><br><span class="muted">Betaald door ${esc(pname(e.payer))} · ${e.participants.length} deelnemers</span> ${ibtn('verwijderen','Uitgave verwijderen',`deleteExpense('${e.id}')`,'danger')}</p>`).join('')||'Nog geen uitgaven.')}`}function addExpense(){modal('Nieuwe uitgave',`<label>Waarvoor?</label><input id="e-title"><label>Bedrag in euro</label><input id="e-amount" type="number" min="0.01" step="0.01"><label>Wie betaalde?</label><select id="e-payer">${options()}</select><p>Wie delen mee?</p>${S.players.map(p=>`<label class="row"><input class="e-person" type="checkbox" value="${p.id}" checked> ${esc(p.name)}</label>`).join('')}<button onclick="saveExpense()">Opslaan</button>`)}function saveExpense(){let cents=Math.round(Number($('#e-amount').value)*100),participants=[...document.querySelectorAll('.e-person:checked')].map(x=>x.value);if(!Number.isSafeInteger(cents)||cents<=0||!participants.length)return alert('Vul een geldig bedrag en ten minste één deelnemer in.');S.expenses.push(item({title:$('#e-title').value||'Uitgave',cents,payer:$('#e-payer').value,participants}));save();closeModal();render()}function deleteExpense(id){if(confirm('Uitgave verwijderen?')){S.expenses=S.expenses.filter(x=>x.id!==id);save();render()}}
function bingoPage(){return `<p>Tik op wat jullie hebben gespot. Een volle rij, kolom of diagonaal is bingo!</p><div class="bingo">${S.bingo.map(b=>`<button class="${b.marked?'on':''}" onclick="toggleBingo('${b.id}')">${esc(b.text)}</button>`).join('')}</div><p class="muted">Bij de eerste bingo kies je wie punten krijgt.</p>`}function toggleBingo(id){let b=S.bingo.find(x=>x.id===id);b.marked=!b.marked;touch(b);render();let a=S.bingo.map(x=>x.marked),lines=[...Array(5)].flatMap((_,i)=>[[0,1,2,3,4].map(j=>i*5+j),[0,1,2,3,4].map(j=>j*5+i)]).concat([[0,6,12,18,24],[4,8,12,16,20]]);if(!S.bingoAwarded&&lines.some(line=>line.every(i=>a[i])))modal('BINGO! 🎉',`<p>Wie krijgt 5 punten?</p><select id="bingo-who">${options('',true)}</select><button onclick="awardBingo()">Punten uitdelen</button>`)}function awardBingo(){let who=$('#bingo-who').value;addPoints(who==='all'?S.players.map(x=>x.id):[who],5,'Bingo','bingo');S.bingoAwarded=true;save();closeModal();toast('BINGO! Sláinte!')}
function wrappedPage(){let r=ranking(),max=Math.max(0,...S.players.map(p=>S.pubs.filter(x=>x.visitors.includes(p.id)).length));return `<section class="card hero"><span class="eyebrow">Galway Wrapped</span><h2>Een trip voor in de boeken.</h2><p>${S.pubs.filter(p=>p.visitedAt).length} pubs · ${S.photos.length} foto’s · ${S.challenges.reduce((n,c)=>n+c.completed.length,0)} behaalde challenges</p><h3>🏆 De eindstand</h3>${r.map((p,i)=>`<p>${i+1}. ${esc(p.name)} — ${score(p.id)} punten</p>`).join('')}<h3>🍺 Meeste pubs</h3><p>${max?S.players.filter(p=>S.pubs.filter(x=>x.visitors.includes(p.id)).length===max).map(x=>esc(x.name)).join(', '):'Nog niemand'} (${max})</p><h3>✨ De awards</h3>${['Eerste die slaapt','Beste verhaal','Grootste eejit','Redder van de avond'].map(a=>`<label>${a}</label><select onchange="setAward('${a}',this.value)"><option value="">Nog niet gekozen</option>${options(S.awards[a]||'')}</select>`).join('')}<p class="muted">Maak een screenshot om dit overzicht te delen.</p></section>`}function setAward(k,v){S.awards[k]=v;save()}
function infoPage(){return `${card('Noodgevallen','<p><a href="tel:112">112</a> / <a href="tel:999">999</a> — ambulance, politie en brandweer</p><p>Taxi: voeg hieronder een lokaal nummer toe.</p>')}${card('Praktische informatie',`<label>Accommodatie, wifi, taxi en laatste bus</label><textarea rows="5" onchange="S.notes=this.value;save()">${esc(S.notes)}</textarea><label>Vlucht en terugreis</label><textarea rows="4" onchange="S.travel=this.value;save()">${esc(S.travel)}</textarea>`)}${card('Iers woordenboek',words.map(w=>`<p><b>${esc(w[0])}</b> · ${esc(w[1])}<br><span class="muted">${esc(w[2])}</span></p>`).join(''))}`}

function vulInhoudAan(){
 let toegevoegd=false;
 const teksten=new Set(S.questions.map(q=>q.text));let volgnummer=S.questions.length;
 for(const [rubriek,lijst] of Object.entries(qsets)){for(const text of lijst){if(teksten.has(text))continue;teksten.add(text);toegevoegd=true;S.questions.push({id:'vraag-v4-'+(volgnummer++),updatedAt:now(),category:rubriek,text,used:false})}}
 const titels=new Set(S.pubDeck.map(c=>c.title));
 PUB_CHALLENGES.forEach(([category,title],i)=>{if(titels.has(title))return;titels.add(title);toegevoegd=true;S.pubDeck.push({id:'pubchallenge-v4-'+i,updatedAt:now(),category,title,seen:false,hidden:false,completed:false,points:2})});
 return toegevoegd;
}
function verwijderOudeInhoud(){
 const kuratie=new Set(Object.values(qsets).flat());
 const rubrieken=new Set(Object.keys(qsets));rubrieken.add('Eigen vragen');
 const kaarten=new Set(PUB_CHALLENGES.map(p=>p[1]));
 const vragen=S.questions.length,kaartent=S.pubDeck.length;
 // Eigen vragen en kaarten blijven staan: die hebben geen machinaal id en staan
 // in een kuratiete rubriek. Het oude machinegewoel heeft rubrieken die er niet
 // meer zijn of ids met een versie erin, en valt dus weg.
 S.questions=S.questions.filter(q=>kuratie.has(q.text)||(rubrieken.has(q.category)&&!/^(question|vraag)-v\d+-\d+$/.test(q.id)));
 S.pubDeck=S.pubDeck.filter(c=>kaarten.has(c.title)||!/^(pubchallenge|kaart)-v\d+-\d+$/.test(c.id));
 return S.questions.length!==vragen||S.pubDeck.length!==kaartent;
}
// Inhoud wordt bij elke start bijgewerkt: de kuratiete set erbij, eerdere
// machinereeksen weg. Pubs, punten, foto's en eigen teksten blijven staan.
function inhoudV4(){
 let gewijzigd=false;if(!Array.isArray(S.pubDeck))S.pubDeck=[];if(!Array.isArray(S.questions))S.questions=[];
 const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
 const voorPubs=S.pubs.length;
 for(const [name,area] of NEW_PUBS){
  let alias=name==='The Front Door / Sonny Molloy’s'&&S.pubs.some(p=>norm(p.name).startsWith('sonny'));
  if(!alias&&!S.pubs.some(p=>norm(p.name)===norm(name)))S.pubs.push(item({id:'pub-v3-'+norm(name),name,area,gimmick:'Zoek iets typisch Iers en geef deze pub een bijnaam.',visitedAt:null,visitors:[],ratings:{}}));
 }
 // De oude basislijst bevatte twee namen voor dezelfde pub. Verwijder alleen een onaangeroerd exemplaar.
 const duplicate=S.pubs.find(p=>norm(p.name)==='sehanuaneachtain');
 if(duplicate&&!duplicate.visitedAt&&!Object.keys(duplicate.ratings||{}).length&&!S.photos.some(x=>x.pubId===duplicate.id))S.pubs=S.pubs.filter(p=>p.id!==duplicate.id);
 if(S.pubs.length!==voorPubs)gewijzigd=true;
 const opgeruimd=verwijderOudeInhoud(),ingevuld=vulInhoudAan();if(gewijzigd||opgeruimd||ingevuld)save();
}
inhoudV4();

function spinChallenge(){if(slotBusy)return;let available=S.pubDeck.filter(x=>!x.hidden&&!x.completed&&!x.seen);if(!available.length){let remaining=S.pubDeck.filter(x=>!x.hidden&&!x.completed);if(!remaining.length){alert('Alle challenges zijn voltooid of verborgen.');return}remaining.forEach(x=>{x.seen=false;x.updatedAt=now()});available=remaining}let selected=available[Math.floor(Math.random()*available.length)];slotBusy=true;let box=$('#slot-window'),button=$('#slot-spin');button.disabled=true;box.classList.add('slot-rolling');let n=0;let timer=setInterval(()=>{if(!document.contains(box)){clearInterval(timer);slotBusy=false;return}box.textContent=available[Math.floor(Math.random()*available.length)].title;if(++n>=12){clearInterval(timer);selected.seen=true;selected.updatedAt=now();S.slotCurrent=selected.id;save();slotBusy=false;render();navigator.vibrate?.([40,40,90])}},65)}

function pubTaskPage(){let chosen=S.selectedPubTask||'',pub=S.pubs.find(p=>p.id===chosen),batch=(S.pubTaskBatches||[]).find(b=>b.pubId===chosen);return `<span class="eyebrow">Vijf opdrachten per pub</span><h2>Pubopdrachten</h2><p>Kies een pub en draai vijf opdrachten. Elke opdracht levert <b>5 punten per geselecteerde speler</b> op.</p><label for="pub-task-select">Welke pub bezoeken jullie?</label><select id="pub-task-select" onchange="selectPubTask(this.value)"><option value="">Kies een pub…</option>${S.pubs.map(p=>`<option value="${p.id}" ${p.id===chosen?'selected':''}>${esc(p.name)}</option>`).join('')}</select>${pub?`<div class="card"><div id="pub-task-result">${batch?batch.tasks.map((t,i)=>`<p><b>${i+1}. ${esc(t.title)}</b><br><span class="muted">Gelukt: ${t.completed.length?t.completed.map(pname).map(esc).join(', '):'nog niemand'}</span> ${btn('Afvinken',`completePubTask('${batch.id}','${t.id}')`)}</p>`).join(''):'<p>🎰 Klaar voor vijf opdrachten in '+esc(pub.name)+'?</p>'}</div>${!batch?'<button id="pub-task-spin" onclick="spinPubTasks()">Draai 5 pubopdrachten</button>':''}</div>`:''}`}
function selectPubTask(id){S.selectedPubTask=id;save();render()}
let spinningPubTasks=false;
function spinPubTasks(){if(spinningPubTasks)return;let id=S.selectedPubTask;if(!S.pubs.some(p=>p.id===id)||(S.pubTaskBatches||[]).some(b=>b.pubId===id))return;spinningPubTasks=true;let box=$('#pub-task-result'),button=$('#pub-task-spin');button.disabled=true;box.classList.add('slot-rolling');let shuffled=[...pubTasks];for(let i=shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}let selected=shuffled.slice(0,5),n=0;let timer=setInterval(()=>{if(!document.contains(box)){clearInterval(timer);spinningPubTasks=false;return}box.innerHTML=shuffled.slice(n%40,n%40+5).map(x=>`<p>🎲 ${esc(x)}</p>`).join('');if(++n>=12){clearInterval(timer);let b=item({pubId:id,tasks:selected.map(title=>item({title,points:5,completed:[]}))});(S.pubTaskBatches??=[]).push(b);save();spinningPubTasks=false;render();navigator.vibrate?.([40,40,90])}},65)}
function completePubTask(batchId,taskId){let b=(S.pubTaskBatches||[]).find(x=>x.id===batchId),t=b?.tasks.find(x=>x.id===taskId);if(!t)return;modal('Wie heeft deze opdracht gehaald?',`<p>${esc(t.title)} · +${t.points} punten per persoon</p>${S.players.map(p=>`<label class="row"><input type="checkbox" class="pub-task-player" value="${p.id}" ${t.completed.includes(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')}<button onclick="savePubTask('${batchId}','${taskId}')">Punten opslaan</button>`)}
function savePubTask(batchId,taskId){let b=S.pubTaskBatches.find(x=>x.id===batchId),t=b.tasks.find(x=>x.id===taskId);t.completed=[...document.querySelectorAll('.pub-task-player:checked')].map(x=>x.value);removeSource('pubtask:'+t.id);addPoints(t.completed,t.points,t.title,'pubtask:'+t.id);t.updatedAt=now();b.updatedAt=now();save();closeModal();render();toast('Pubpunten opgeslagen')}

function activeBoard(){ensureBingoBoards();return S.bingoBoards.find(b=>b.id===S.activeBingoId)}
function grantFullBingo(b){if(b.fullAwarded||!b.cells.every(x=>x.marked))return;let source='bingo-board:'+b.id;let existing=new Set(S.transactions.filter(t=>t.source===source).map(t=>t.playerId));addPoints(S.players.filter(p=>!existing.has(p.id)).map(p=>p.id),10,'Vol bingobord '+b.number,source);b.fullAwarded=true;b.updatedAt=now();save();toast('Volle kaart! Iedereen +10 punten')}
bingoPage=function(){let b=activeBoard();grantFullBingo(b);let full=b.cells.every(x=>x.marked);return `<span class="eyebrow">Samen op pad</span><h2>Gezamenlijke bingo</h2><p>Een volledig bord levert <b>iedereen 10 punten</b> op. Tik de gebeurtenissen aan die jullie samen zien.</p><p class="muted">Bord ${b.number} van ${S.bingoBoards.length} ${b.fullAwarded?'· bonus toegekend':''}</p><div class="bingo">${b.cells.map(c=>`<button class="${c.marked?'on':''}" onclick="toggleBoardCell('${b.id}','${c.id}')">${esc(c.text)}</button>`).join('')}</div><div class="actions">${S.bingoBoards.length>1?`<label>Bord bekijken <select onchange="showBingoBoard(this.value)">${S.bingoBoards.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>Bord ${x.number}</option>`).join('')}</select></label>`:''}${full&&b.id===S.bingoBoards[S.bingoBoards.length-1].id?'<button onclick="nextBingoBoard()">Nieuw bord →</button>':''}</div>`};
function toggleBoardCell(boardId,id){let b=S.bingoBoards.find(x=>x.id===boardId),c=b?.cells.find(x=>x.id===id);if(!c)return;c.marked=!c.marked;c.updatedAt=now();b.updatedAt=now();save();grantFullBingo(b);render()}
function showBingoBoard(id){S.activeBingoId=id;save();render()}
function nextBingoBoard(){let old=activeBoard();if(!old.cells.every(x=>x.marked)||old.id!==S.bingoBoards[S.bingoBoards.length-1].id)return;grantFullBingo(old);let pool=[...bingoPrompts];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let cells=pool.slice(0,24).map(text=>item({text,marked:false}));cells.splice(12,0,item({text:'GRATIS VAKJE',marked:true}));let b=item({number:S.bingoBoards.length+1,cells,fullAwarded:false});S.bingoBoards.push(b);S.activeBingoId=b.id;save();render()}

let questionBusy=false;
nextQuestion=function(){if(questionBusy)return;let sel=$('#q-category'),button=$('#question-spin'),box=$('#question');let cat=sel.value,qs=S.questions.filter(q=>cat==='all'||q.category===cat),available=qs.filter(q=>!q.used);if(!available.length){qs.forEach(q=>{q.used=false;q.updatedAt=now()});available=qs}if(!available.length)return;let q=available[Math.floor(Math.random()*available.length)];questionBusy=true;button.disabled=true;sel.disabled=true;box.classList.add('slot-rolling');let n=0,timer=setInterval(()=>{if(!document.contains(box)){clearInterval(timer);questionBusy=false;return}box.textContent=available[Math.floor(Math.random()*available.length)].text;if(++n>=12){clearInterval(timer);q.used=true;touch(q);lastQuestion=q.text;box.textContent=q.text;box.classList.remove('slot-rolling');button.disabled=false;sel.disabled=false;questionBusy=false;navigator.vibrate?.([40,40,90])}},65)};

function pointsInfoPage(){return `<div class="spread"><h2>Zo verdien je punten</h2><button class="secondary" onclick="pointsBack()">← Terug</button></div><p class="muted">De stand wordt automatisch bijgewerkt zodra je punten opslaat.</p>${card('Pub bezoeken',`<p><b>+1 punt per bezoeker.</b> Vink een pub af en kies wie erbij was. Pas je de bezoekers later aan, dan worden de punten opnieuw berekend.</p>`)}${card('Pubopdrachten',`<p><b>+5 punten per speler per opdracht.</b> Kies een pub, draai vijf opdrachten en vink per opdracht aan wie deze heeft gehaald. Je kunt die keuze later aanpassen.</p>`)}${card('Zit-challenges',`<p><b>Meestal +2 punten per geselecteerde speler.</b> Draai een challenge en kies bij ‘Gelukt’ een speler of iedereen. Het aantal punten staat bij de opdracht.</p>`)}${card('Gezamenlijke bingo',`<p><b>+10 punten voor iedere speler</b> wanneer alle vakjes op het bord zijn afgevinkt. De bonus wordt één keer per bord toegekend. Daarna kun je een nieuw bord openen.</p>`)}${card('Groepsfoto’s & eigen challenges',`<p>Een groepsfoto levert punten op als jullie deze als <b>groepsfoto-challenge afvinken</b>. Selecteer daarbij iedereen die punten krijgt. De puntenwaarde staat bij de challenge en kun je bij eigen challenges instellen.</p><p class="muted">Een foto alleen toevoegen aan het album geeft geen automatische punten.</p>`)}${card('Bonus- en strafpunten',`<p>Via <b>Meer → Scores → + / − Punten</b> kun je per speler handmatig punten toevoegen of aftrekken, eventueel met een reden.</p>`)}<p class="muted">Vragen en het afvinken van een activiteit zonder gekoppelde challenge geven geen punten.</p>`}
morePage=function(){if(more==='Puntenuitleg')return pointsInfoPage();let result=ptsMorePage();if(more==='Meer')result+=`<div class="card spread"><b>Uitleg punten</b><button class="secondary" onclick="openPointsInfo()">Bekijk →</button></div>`;return result};


// Gisteren wordt bepaald in de tijdzone van de reis, ook rond middernacht en zomertijd.
function irishDay(value){let date=new Date(value);if(!Number.isFinite(date.getTime()))return '';let parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Dublin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);let m=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${m.year}-${m.month}-${m.day}`}
function yesterdayIreland(){let today=irishDay(new Date()),[y,m,d]=today.split('-').map(Number);return new Date(Date.UTC(y,m-1,d-1)).toISOString().slice(0,10)}
function dailyWrapped(){let day=yesterdayIreland(),totals={};let transactions=S.transactions.filter(t=>irishDay(t.updatedAt)===day);transactions.forEach(t=>{totals[t.playerId]=(totals[t.playerId]||0)+Number(t.points||0)});let pubs=S.pubs.filter(p=>p.visitedAt&&irishDay(p.visitedAt)===day),photos=S.photos.filter(p=>p.createdAt&&irishDay(p.createdAt)===day),total=transactions.reduce((n,t)=>n+Number(t.points||0),0),leaders=Object.entries(totals).sort((a,b)=>b[1]-a[1]),date=new Date(day+'T12:00:00Z').toLocaleDateString('nl-NL',{timeZone:'Europe/Dublin',weekday:'long',day:'numeric',month:'long'});if(!transactions.length&&!pubs.length&&!photos.length)return card('Gisteren in Galway',`<p class="muted">${esc(date)}</p><p>Geen opgeslagen avonturen van gisteren. De legende moet nog beginnen!</p>`);let top=leaders.length?leaders.filter(x=>x[1]===leaders[0][1]).map(x=>esc(pname(x[0]))).join(' &amp; '):null;return card('Gisteren in Galway',`<p class="muted">${esc(date)} · Daily Wrapped</p><p>🍺 <b>${pubs.length}</b> ${pubs.length===1?'pub':'pubs'} bezocht · 📸 <b>${photos.length}</b> ${photos.length===1?'foto':'foto’s'} opgeslagen</p><p>⭐ Samen <b>${total>0?'+':''}${total} punten</b> bijgeschreven.</p>${top?`<p>🏆 Dagtopper: <b>${top}</b> (${leaders[0][1]>0?'+':''}${leaders[0][1]} punten). Sláinte!</p>`:'<p>De camera was sneller dan het scorebord.</p>'}<p class="muted">Gebaseerd op lokaal opgeslagen tijden. Latere correcties kunnen de terugblik veranderen.</p>`)}
const beforeDailyHome=home;
home=function(){let result=beforeDailyHome().replace('<button onclick="sub(\'Vragen\')">Ik verveel me</button>','');return result+dailyWrapped()};

// Eén versie van elk onderdeel in de navigatie; overige functies blijven in Meer.
const beforeTidyMore=morePage;
morePage=function(){if(more!=='Meer')return beforeTidyMore();let items=['Vandaag & planning','Fotoalbum','Uitgaven','Wrapped','Handige info','Spelers','Back-up','Scores','Configuratie'];return `<h2>Meer craic</h2>${items.map(name=>`<div class="card spread"><b>${name}</b><button class="secondary" onclick="sub('${name}')">Open →</button></div>`).join('')}<div class="card spread"><b>Uitleg punten</b><button class="secondary" onclick="openPointsInfo()">Bekijk →</button></div>`};

// Het wiel staat onder de zit-challenges; een afzonderlijke uitkomst heeft 1/25 kans per draai.
const beforeV6Spin=spinChallenge;
spinChallenge=function(){if(slotBusy)return;if(Math.random()>=1/25){S.slotWheelPrompt=false;beforeV6Spin();return}slotBusy=true;let box=$('#slot-window'),button=$('#slot-spin');button.disabled=true;box.classList.add('slot-rolling');let n=0,timer=setInterval(()=>{if(!document.contains(box)){clearInterval(timer);slotBusy=false;return}box.textContent=['🍀 Geluk van de Ieren','🎲 Het lot beslist','🎡 Draai het wiel!'][n%3];if(++n>=12){clearInterval(timer);S.slotWheelPrompt=true;S.slotCurrent=null;save();slotBusy=false;render();navigator.vibrate?.([40,40,90])}},65)};
slotPage=function(){let current=(S.pubDeck||[]).find(x=>x.id===S.slotCurrent),remaining=S.pubDeck.filter(x=>!x.completed&&!x.hidden&&!x.seen).length,hidden=S.pubDeck.filter(x=>x.hidden).length,prompt=S.slotWheelPrompt;return `${pointsLink()}<span class="eyebrow">Voor aan tafel</span><h2>Zit-challenges</h2><p class="muted">${S.pubDeck.length} kaarten · ${remaining} nog niet gezien in deze ronde · ${hidden} verborgen</p><div class="card"><div class="slot-window" id="slot-window">${prompt?'🎡 Draai het wiel!':current?esc(current.title):'Klaar voor de craic?'}</div><p class="muted" id="slot-category">${prompt?'Ga hieronder naar het wiel en laat het lot beslissen.':current?esc(current.category)+' · +'+current.points+' punten':''}</p><div class="stack"><button id="slot-spin" onclick="spinChallenge()">${current||prompt?'Skip voor nu & draai':'Draai een challenge'}</button>${current&&!prompt?`<button class="secondary" onclick="completeSlot()">Gelukt! Punten uitdelen</button><button class="secondary" onclick="hideSlot()">Skip en laat niet meer zien</button>`:''}</div></div><p class="muted">Een gewone skip kan in een volgende ronde terugkomen. Een verborgen of voltooide kaart komt niet vanzelf terug.</p><section class="card"><span class="eyebrow">Het lot beslist</span><h2>Het wiel</h2><p>Kies een wiel en draai wanneer jullie willen.</p>${wheelPage()}</section>`};
const beforeEmbeddedWheelRender=render;
render=function(){beforeEmbeddedWheelRender();if(S.setup&&S.players.some(p=>p.id===localStorage.getItem('galway-current-player'))&&(page==='Challenges'||page==='Slot'))drawWheel()};

// Brug voor de losse bestanden eronder (sync.js, duels.js): draaien in eigen
// bestand, maar hebben de live-status en een paar helpers van hier nodig.
window.Galway={get state(){return S},set state(v){S=v},save:()=>save(),render:()=>render(),item:o=>item(o),uid:()=>uid(),now:()=>now(),points:(ids,aantal,label,bron)=>addPoints(ids,aantal,label,bron),clearPoints:bron=>removeSource(bron)};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(console.error);render();
</script><script src="./config.js"></script><script src="./sync.js"></script><script src="./duels.js"></script><script src="./pubgolf.js"></script></body></html>
